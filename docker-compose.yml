version: '3.8'

services:
  # 1. Relational Database Service (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: smart_school_db
    restart: always
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: SuperSecurePassword2026! # Change this to a very strong password
      POSTGRES_DB: smart_school_v6
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically run the multi-school schema script on initial startup
      - ./schema-v6.sql:/docker-entrypoint-initdb.d/schema-v6.sql

  # 2. Python Web Application Service (Streamlit App)
  web:
    build: .
    container_name: smart_school_web
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=smart_school_v6
      - DB_USER=school_admin
      - DB_PASSWORD=SuperSecurePassword2026!

volumes:
  postgres_data:
